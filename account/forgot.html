<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Смена пароля — DisplayWord</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--navy2); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 420px; }
    .logo { font-size: 1.1rem; font-weight: 800; color: var(--accent); text-decoration: none; display: block; margin-bottom: 28px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    .sub { font-size: 0.9rem; color: var(--gray); margin-bottom: 28px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--gray); margin-bottom: 6px; }
    input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 11px 14px; color: var(--white); font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.2s; margin-bottom: 18px; }
    input:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 9px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; margin-top: 4px; font-family: inherit; }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { font-size: 0.88rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .msg.error { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
    .msg.success { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
    .footer-link { text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--gray); }
    .footer-link a { color: var(--accent); text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }

    /* #116 — нативные виджеты в тёмной теме и перекраска автозаполнения */
    :root { color-scheme: dark; }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #212b3f inset;
      -webkit-text-fill-color: var(--white);
      caret-color: var(--white);
    }
    input:autofill {
      box-shadow: 0 0 0 1000px #212b3f inset;
      -webkit-text-fill-color: var(--white);
      filter: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="logo">DisplayWord</a>
    <h1>Забыли пароль?</h1>
    <p class="sub">Укажите email — пришлём ссылку для смены пароля</p>

    <div class="msg" id="msg"></div>

    <form id="form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required />

      <button type="submit" class="btn" id="btn">Отправить ссылку</button>
    </form>

    <div class="footer-link"><a href="/account/login">← Вернуться ко входу</a></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const btn  = document.getElementById('btn');
    const msg  = document.getElementById('msg');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = `msg ${type}`;
      msg.style.display = 'block';
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Отправляем…';
      msg.style.display = 'none';

      try {
        const res = await fetch('/api/v1/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email: document.getElementById('email').value }),
        });
        const data = await res.json();
        if (res.ok) {
          showMsg(data.message, 'success');
          form.style.display = 'none';
        } else {
          showMsg(data.message || 'Ошибка. Попробуйте ещё раз.', 'error');
          btn.disabled = false;
          btn.textContent = 'Отправить ссылку';
        }
      } catch {
        showMsg('Ошибка сети. Попробуйте ещё раз.', 'error');
        btn.disabled = false;
        btn.textContent = 'Отправить ссылку';
      }
    });
  </script>
</body>
</html>
