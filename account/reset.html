<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новый пароль — DisplayWord</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--navy2); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 420px; }
    .logo { font-size: 1.1rem; font-weight: 800; color: var(--accent); text-decoration: none; display: block; margin-bottom: 28px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    .sub { font-size: 0.9rem; color: var(--gray); margin-bottom: 28px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--gray); margin-bottom: 6px; }
    input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 11px 14px; color: var(--white); font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.2s; margin-bottom: 18px; }
    input:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 9px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; margin-top: 4px; font-family: inherit; }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { font-size: 0.88rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .msg.error { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
    .msg.success { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
    .footer-link { text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--gray); }
    .footer-link a { color: var(--accent); text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="logo">DisplayWord</a>
    <h1>Новый пароль</h1>
    <p class="sub">Придумайте новый пароль для входа</p>

    <div class="msg" id="msg"></div>

    <form id="form">
      <label for="password">Новый пароль</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" />

      <label for="password2">Повторите новый пароль</label>
      <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8" />

      <button type="submit" class="btn" id="btn">Сменить пароль</button>
    </form>

    <div class="footer-link" id="againLink" style="display:none"><a href="/account/forgot">Запросить новую ссылку</a></div>
  </div>

  <script>
    const form  = document.getElementById('form');
    const btn   = document.getElementById('btn');
    const msg   = document.getElementById('msg');
    const again = document.getElementById('againLink');

    const token = new URLSearchParams(location.search).get('token') || '';

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = `msg ${type}`;
      msg.style.display = 'block';
    }

    if (!token) {
      showMsg('Ссылка неполная — в ней нет кода. Запросите новую.', 'error');
      form.style.display = 'none';
      again.style.display = 'block';
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      if (p1.length < 8) { showMsg('Минимум 8 символов', 'error'); return; }
      if (p1 !== p2)     { showMsg('Пароли не совпадают', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'Меняем…';
      msg.style.display = 'none';

      try {
        const res = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ token, newPassword: p1 }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/account/login?reset=1';
        } else if (data.error === 'invalid_token' || data.error === 'token_expired') {
          showMsg(data.message || 'Ссылка недействительна. Запросите новую.', 'error');
          form.style.display = 'none';
          again.style.display = 'block';
        } else {
          showMsg(data.message || 'Ошибка. Попробуйте ещё раз.', 'error');
          btn.disabled = false;
          btn.textContent = 'Сменить пароль';
        }
      } catch {
        showMsg('Ошибка сети. Попробуйте ещё раз.', 'error');
        btn.disabled = false;
        btn.textContent = 'Сменить пароль';
      }
    });
  </script>
</body>
</html>
