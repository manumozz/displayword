<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кабинет — DisplayWord</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script src="/countries.js"></script>
  <style>
    .topbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: rgba(15,27,45,0.97); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0 5%; z-index: 100; }
    .topbar-logo { font-size: 1rem; font-weight: 800; color: var(--accent); text-decoration: none; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .user-email { font-size: 0.85rem; color: var(--gray); }
    .btn-logout { background: none; border: 1px solid rgba(255,255,255,0.1); color: var(--gray); padding: 6px 14px; border-radius: 7px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .btn-logout:hover { border-color: rgba(255,255,255,0.2); color: var(--white); }
    main { padding: 40px 5% 60px; max-width: 860px; margin: 0 auto; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
    .sub { color: var(--gray); margin-bottom: 40px; }
    h1, #welcomeSub { overflow-wrap: anywhere; } /* #111 — long names (no spaces) shouldn't blow out the page */
    .section-title { font-size: 0.78rem; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
    .empty-card { background: var(--navy2); border: 1px dashed rgba(255,255,255,0.1); border-radius: 14px; padding: 40px; text-align: center; color: var(--gray); }
    .empty-card p { margin-bottom: 20px; font-size: 0.95rem; }
    .btn-primary { display: inline-block; background: var(--accent); color: #fff; padding: 11px 24px; border-radius: 9px; font-size: 0.92rem; font-weight: 700; text-decoration: none; transition: opacity 0.2s; border: none; cursor: pointer; font-family: inherit; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .key-card { background: var(--navy2); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 24px 28px; margin-bottom: 14px; }
    .key-community { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
    .key-string { font-family: monospace; font-size: 0.78rem; color: var(--gray); word-break: break-all; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; margin: 10px 0; }
    .key-meta { font-size: 0.82rem; color: var(--gray); }
    .badge-active { display: inline-block; background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.2); padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .app-card { background: var(--navy2); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 20px 28px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .app-info { font-size: 0.9rem; }
    .app-info strong { display: block; margin-bottom: 4px; }
    .app-info span { color: var(--gray); font-size: 0.82rem; }
    .status-pending  { color: var(--gold); }
    .status-approved { color: var(--green); }
    .status-rejected { color: #f87171; }
    .section { margin-bottom: 0; } /* #112 — one section per pane, no trailing whitespace */
    .loader { color: var(--gray); font-size: 0.9rem; }

    /* #106 — profile + change-password */
    .card-form { background: var(--navy2); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 28px; }
    .card-form label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--gray); margin-bottom: 6px; margin-top: 18px; }
    .card-form label:first-of-type { margin-top: 0; }
    .card-form input[type=text], .card-form input[type=password], .card-form select {
      width: 100%; box-sizing: border-box;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 11px 14px;
      color: var(--white); font-size: 0.95rem; font-family: inherit;
      outline: none; transition: border-color 0.2s;
    }
    .card-form input:focus, .card-form select:focus { border-color: var(--accent); }
    .card-form .btn-primary { margin-top: 24px; width: 100%; }
    .card-form select {
      appearance: none; -webkit-appearance: none; padding-right: 36px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23a0aec0' d='M6 8L0 0h12z'/></svg>");
      background-repeat: no-repeat; background-position: right 14px center; background-size: 12px;
    }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--gray);
      padding: 4px; line-height: 1; font-size: 1rem;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--white); }
    .msg { font-size: 0.88rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .msg.error   { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
    .msg.success { background: rgba(74,222,128,0.1);  color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
    .greeting-hint { display: block; margin-top: 8px; font-size: 0.9rem; color: var(--gray); }
    .greeting-hint a { color: var(--accent); text-decoration: none; }
    .greeting-hint a:hover { text-decoration: underline; }

    /* #115 — тёмные option и комбобокс страны */
    .card-form select option { background: #0f1b2d; color: #fff; }
    .combo { position: relative; }
    .combo input { padding-right: 40px; }
    .combo-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--gray); cursor: pointer;
      font-size: 0.75rem; padding: 4px; line-height: 1;
    }
    .combo-list {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60;
      background: #0f1b2d; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
      max-height: 260px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .combo-item { padding: 9px 14px; font-size: 0.92rem; cursor: pointer; }
    .combo-item:hover, .combo-item.active { background: rgba(255,255,255,0.08); }
    .combo-empty { padding: 9px 14px; color: var(--gray); font-size: 0.88rem; }

    /* #112 — раскладка с левым меню */
    body { padding-top: 60px; }
    .side {
      position: fixed; top: 60px; bottom: 0; left: 0; width: 220px;
      display: block; height: auto;
      box-sizing: border-box; overflow-y: auto; z-index: 90;
      background: var(--navy2); border-right: 1px solid rgba(255,255,255,0.06);
      padding: 24px 0;
    }
    .side-item {
      display: block; box-sizing: border-box; text-decoration: none;
      color: var(--gray); font-size: 0.95rem; font-weight: 600;
      padding: 11px 16px; border-left: 3px solid transparent;
      border-radius: 0 9px 9px 0; transition: background 0.2s, color 0.2s;
    }
    .side-item:hover { background: rgba(255,255,255,0.04); color: var(--white); }
    .side-item.active { background: rgba(255,255,255,0.07); color: var(--white); border-left-color: var(--accent); }
    .side-item.admin { color: var(--gold); }
    .side-sep { height: 1px; background: rgba(255,255,255,0.08); margin: 16px 16px; }
    .content { padding-left: 220px; }
    .pane { display: none; }
    .pane.active { display: block; }

    @media (max-width: 1024px) {
      .side {
        position: sticky; top: 60px; bottom: auto; width: auto;
        display: flex; height: auto; align-items: center; justify-content: flex-start;
        gap: 6px; overflow-x: auto; padding: 10px 12px;
        border-right: none; border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .side-item { white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; border-radius: 9px; padding: 9px 14px; }
      .side-item.active { border-left-color: transparent; border-bottom-color: var(--accent); }
      .side-sep { display: none; }
      .content { padding-left: 0; }
    }

    /* #116 — нативные виджеты в тёмной теме и перекраска автозаполнения */
    :root { color-scheme: dark; }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #212b3f inset;
      -webkit-text-fill-color: var(--white);
      caret-color: var(--white);
    }
    input:autofill {
      box-shadow: 0 0 0 1000px #212b3f inset;
      -webkit-text-fill-color: var(--white);
      filter: none;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="topbar-logo">DisplayWord</a>
    <div class="topbar-right">
      <span class="user-email" id="userEmail"></span>
      <button class="btn-logout" id="btnLogout">Выйти</button>
    </div>
  </div>

  <nav class="side">
    <a href="#keys"     id="nav-keys"     class="side-item">Ключи</a>
    <a href="#profile"  id="nav-profile"  class="side-item">Профиль</a>
    <a href="#security" id="nav-security" class="side-item">Безопасность</a>
    <div class="side-sep"></div>
    <a href="/admin/" id="navAdmin" class="side-item admin" style="display:none">Админка →</a>
  </nav>

  <div class="content">
    <main>
      <h1>Личный кабинет</h1>
      <p class="sub" id="welcomeSub">Загрузка…</p>

      <div class="pane" id="pane-keys">
        <div class="section">
          <div class="section-title">Лицензионные ключи</div>
          <div id="keysContainer" class="loader">Загрузка…</div>
        </div>
      </div>

      <div class="pane" id="pane-profile">
        <div class="section">
          <div class="section-title">Профиль</div>
          <div class="card-form">
            <div id="profileMsg" class="msg"></div>

            <label for="profName">Имя</label>
            <input type="text" id="profName" maxlength="80" placeholder="Как к вам обращаться" autocomplete="off" />

            <label for="profCommunity">Собрание</label>
            <input type="text" id="profCommunity" maxlength="120" placeholder="Название собрания" autocomplete="off" />

            <label for="profCity">Город</label>
            <input type="text" id="profCity" maxlength="80" autocomplete="off" />

            <label for="profCountry">Страна</label>
            <div class="combo">
              <input type="text" id="profCountry" autocomplete="off" placeholder="Начните вводить название" />
              <button type="button" class="combo-toggle" id="countryToggle" tabindex="-1" aria-label="Показать список">▼</button>
              <div class="combo-list" id="countryList" hidden></div>
            </div>

            <label for="profRole">Роль</label>
            <select id="profRole" autocomplete="off">
              <option value="">— не указана —</option>
              <option value="pastor">Пастор</option>
              <option value="worship">Лидер прославления</option>
              <option value="operator">Оператор</option>
              <option value="sound">Звукооператор</option>
              <option value="other">Другое</option>
            </select>
            <div id="roleCustomWrap" style="display:none">
              <label for="profRoleCustom">Какая роль?</label>
              <input type="text" id="profRoleCustom" maxlength="60" autocomplete="off" placeholder="Напишите свою роль" />
            </div>

            <div id="repWrap" style="display:none">
              <label for="repSelectCab">Установка и обучение</label>
              <div id="repFrozen" style="display:none; font-size: 0.95rem; padding: 4px 0 0;"></div>
              <select id="repSelectCab" style="display:none">
                <option value="">Никто, нашли сами</option>
              </select>
            </div>

            <button type="button" class="btn-primary" id="profileSave">Сохранить</button>
          </div>
        </div>
      </div>

      <div class="pane" id="pane-security">
        <div class="section">
          <div class="section-title">Смена пароля</div>
          <div class="card-form">
            <div id="pwMsg" class="msg"></div>

            <label for="pwCurrent">Текущий пароль</label>
            <div class="pw-wrap">
              <input type="password" id="pwCurrent" autocomplete="current-password" />
              <button type="button" class="toggle-pw" onclick="togglePw('pwCurrent', this)" title="Показать пароль">👁</button>
            </div>

            <label for="pwNew">Новый пароль</label>
            <div class="pw-wrap">
              <input type="password" id="pwNew" autocomplete="new-password" />
              <button type="button" class="toggle-pw" onclick="togglePw('pwNew', this)" title="Показать пароль">👁</button>
            </div>

            <label for="pwNew2">Повторите новый пароль</label>
            <div class="pw-wrap">
              <input type="password" id="pwNew2" autocomplete="new-password" />
              <button type="button" class="toggle-pw" onclick="togglePw('pwNew2', this)" title="Показать пароль">👁</button>
            </div>

            <button type="button" class="btn-primary" id="pwChange">Сменить пароль</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // #112 — pane switching via address bar; sync at parse time so it doesn't flash
    const PANES = ['keys', 'profile', 'security'];
    function showPane(name) {
      const target = PANES.indexOf(name) >= 0 ? name : 'keys';
      for (const p of PANES) {
        document.getElementById('pane-' + p).classList.toggle('active', p === target);
        document.getElementById('nav-'  + p).classList.toggle('active', p === target);
      }
      window.scrollTo(0, 0);
    }
    function paneFromHash() {
      return String(location.hash || '').replace(/^#/, '');
    }
    window.addEventListener('hashchange', function () { showPane(paneFromHash()); });
    showPane(paneFromHash());

    async function load() {
      // Check auth
      const meRes = await fetch('/api/v1/me', { credentials: 'same-origin' });
      if (!meRes.ok) { window.location.href = '/account/login'; return; }
      const me = await meRes.json();

      document.getElementById('userEmail').textContent = me.email;
      // #112 — admin link moved to side menu; show only for admins
      if (me.isAdmin) document.getElementById('navAdmin').style.display = 'block';

      renderGreeting(me);
      populateProfileForm(me.profile || {});

      // Keys
      const keysRes = await fetch('/api/v1/keys', { credentials: 'same-origin' });
      const keysEl  = document.getElementById('keysContainer');
      if (keysRes.ok) {
        const keys = await keysRes.json();
        if (keys.length === 0) {
          keysEl.innerHTML = `
            <div class="empty-card">
              <p>Ключей пока нет — и чтобы начать, они не нужны. Скачайте программу: 60 дней полного доступа, дальше бесплатная версия Church. Купленные ключи появятся здесь.</p>
              <a href="/download" class="btn-primary">Скачать программу</a>
            </div>`;
        } else {
          keysEl.innerHTML = keys.map(k => `
            <div class="key-card">
              <div class="key-community">${esc(k.community_name)} <span class="badge-active">Активен</span></div>
              <div class="key-string">${esc(k.key_string)}</div>
              <div class="key-meta">Выдан: ${fmt(k.issued_at)} · Режим: ${k.mode} · Активации: ${k.activations}/${k.activation_limit ?? '∞'}</div>
            </div>`).join('');
        }
      } else {
        keysEl.textContent = 'Ошибка загрузки ключей.';
      }
    }

    function renderGreeting(me) {
      const profile = me.profile || {};
      const h1 = document.querySelector('h1');
      const welcomeSub = document.getElementById('welcomeSub');

      if (profile.name) {
        h1.textContent = 'Здравствуйте, ' + profile.name + '!';
      } else {
        h1.textContent = 'Личный кабинет';
      }

      welcomeSub.textContent = '';
      welcomeSub.append(me.email);
      if (profile.community) welcomeSub.append(' · ' + profile.community);
      // #112 — admin link is in the side menu, not in #welcomeSub anymore
      if (!profile.name) {
        const hint = document.createElement('span');
        hint.className = 'greeting-hint';
        const link = document.createElement('a');
        link.href = '#profile';
        link.textContent = 'Расскажите, как к вам обращаться →';
        hint.appendChild(link);
        welcomeSub.appendChild(hint);
      }
    }

    function populateProfileForm(profile) {
      document.getElementById('profName').value      = profile.name      || '';
      document.getElementById('profCommunity').value = profile.community || '';
      document.getElementById('profCity').value      = profile.city      || '';
      document.getElementById('profRole').value      = profile.role      || '';
      document.getElementById('profRoleCustom').value = profile.roleCustom || '';
      syncRoleCustom();
      populateCountries(profile); // #115 — комбобокс страны
      syncRep(profile); // #120 — представитель
    }

    // #117 — вписка роли при «Другое»
    const roleSelect = document.getElementById('profRole');
    const roleCustomWrap = document.getElementById('roleCustomWrap');
    function syncRoleCustom() {
      roleCustomWrap.style.display = roleSelect.value === 'other' ? 'block' : 'none';
    }
    roleSelect.addEventListener('change', syncRoleCustom);

    // #120 — представитель: если выбран — только показываем; если нет и окно
    // 30 дней открыто — даём выбрать один раз; иначе показываем «Никто».
    function syncRep(profile) {
      const wrap   = document.getElementById('repWrap');
      const frozen = document.getElementById('repFrozen');
      const sel    = document.getElementById('repSelectCab');
      wrap.style.display = 'block';
      if (profile.repName) {
        frozen.textContent = 'Вас сопровождает: ' + profile.repName;
        frozen.style.display = 'block';
        sel.style.display = 'none';
      } else if (profile.repCanChoose) {
        frozen.style.display = 'none';
        sel.style.display = 'block';
        if (sel.options.length === 1) {
          fetch('/api/v1/representatives')
            .then(r => r.ok ? r.json() : { reps: [] })
            .then(d => {
              for (const rep of (d.reps || [])) {
                const o = document.createElement('option');
                o.value = rep.id;
                o.textContent = rep.name;
                sel.appendChild(o);
              }
            })
            .catch(() => {});
        }
      } else {
        frozen.textContent = 'Никто, нашли сами';
        frozen.style.display = 'block';
        sel.style.display = 'none';
      }
    }

    // #115 — страна: комбобокс с фильтрацией по вводу вместо select на 249 строк.
    // Выбранное значение хранится кодом ISO в countryCode; в поле — русское название.
    let countryCode = '';
    const countryInput  = document.getElementById('profCountry');
    const countryList   = document.getElementById('countryList');
    const countryToggle = document.getElementById('countryToggle');

    function countries() { return (typeof DW_COUNTRIES === 'undefined') ? [] : DW_COUNTRIES; }
    function countryNameByCode(code) {
      const c = countries().find(x => x.code === code);
      return c ? c.name : '';
    }

    function populateCountries(profile) {
      countryCode = (profile && profile.country) || '';
      countryInput.value = countryNameByCode(countryCode);
    }

    function renderCountryList(query) {
      const q = String(query || '').trim().toLowerCase();
      const items = countries().filter(c =>
        !q || c.name.toLowerCase().includes(q) || c.code.toLowerCase() === q);
      countryList.textContent = '';
      const none = document.createElement('div');
      none.className = 'combo-item';
      none.dataset.code = '';
      none.textContent = '— не указана —';
      countryList.appendChild(none);
      for (const c of items) {
        const el = document.createElement('div');
        el.className = 'combo-item';
        el.dataset.code = c.code;
        el.textContent = c.name;
        if (c.code === countryCode) el.classList.add('active');
        countryList.appendChild(el);
      }
      if (!items.length) {
        const e = document.createElement('div');
        e.className = 'combo-empty';
        e.textContent = 'Не найдено';
        countryList.appendChild(e);
      }
      countryList.hidden = false;
      const act = countryList.querySelector('.combo-item.active');
      if (act) act.scrollIntoView({ block: 'nearest' });
    }

    function closeCountryList() {
      countryList.hidden = true;
      countryInput.value = countryNameByCode(countryCode);
    }

    countryInput.addEventListener('input', () => renderCountryList(countryInput.value));
    countryInput.addEventListener('focus', () => renderCountryList(countryInput.value));
    countryToggle.addEventListener('click', () => {
      if (countryList.hidden) { countryInput.focus(); renderCountryList(''); }
      else closeCountryList();
    });
    countryList.addEventListener('mousedown', (e) => {
      const el = e.target.closest('.combo-item');
      if (!el) return;
      e.preventDefault();
      countryCode = el.dataset.code || '';
      closeCountryList();
    });
    countryInput.addEventListener('keydown', (e) => {
      if (countryList.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        renderCountryList(countryInput.value); e.preventDefault(); return;
      }
      if (countryList.hidden) return;
      const items = [...countryList.querySelectorAll('.combo-item')];
      let i = items.findIndex(el => el.classList.contains('active'));
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        i = e.key === 'ArrowDown' ? Math.min(i + 1, items.length - 1) : Math.max(i - 1, 0);
        items.forEach(el => el.classList.remove('active'));
        if (items[i]) { items[i].classList.add('active'); items[i].scrollIntoView({ block: 'nearest' }); }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        // выбранный стрелками пункт; если стрелок не было и ровно одно совпадение — взять его
        let el = items[i];
        if (!el) {
          const real = items.filter(x => x.dataset.code !== '');
          if (real.length === 1) el = real[0];
        }
        if (el) countryCode = el.dataset.code || '';
        closeCountryList();
      } else if (e.key === 'Escape') {
        closeCountryList();
      }
    });
    countryInput.addEventListener('blur', () => {
      // клик по пункту обрабатывается в mousedown до blur
      setTimeout(closeCountryList, 100);
    });

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.href = '/account/login';
    });

    // Profile save
    document.getElementById('profileSave').addEventListener('click', async () => {
      const btn = document.getElementById('profileSave');
      const oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Сохраняем…';

      const body = {
        name:      document.getElementById('profName').value,
        community: document.getElementById('profCommunity').value,
        city:      document.getElementById('profCity').value,
        country:   countryCode, // #115 — код из комбобокса
        role:      document.getElementById('profRole').value,
        roleCustom: document.getElementById('profRoleCustom').value,
        repId:     document.getElementById('repSelectCab').value,
      };

      try {
        const res = await fetch('/api/v1/me', {
          method: 'PATCH',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          renderGreeting(data);
          populateProfileForm(data.profile || {});
          // #115 — страна обновляется внутри populateProfileForm → populateCountries
          showFormMsg('profileMsg', 'Сохранено', 'success');
          setTimeout(() => hideFormMsg('profileMsg'), 3000);
        } else {
          showFormMsg('profileMsg', data.message || 'Ошибка сохранения', 'error');
        }
      } catch {
        showFormMsg('profileMsg', 'Ошибка сети. Попробуйте ещё раз.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = oldText;
      }
    });

    // Password change
    document.getElementById('pwChange').addEventListener('click', async () => {
      const cur = document.getElementById('pwCurrent').value;
      const neu = document.getElementById('pwNew').value;
      const rep = document.getElementById('pwNew2').value;
      if (!cur || !neu || !rep) {
        showFormMsg('pwMsg', 'Заполните все три поля', 'error'); return;
      }
      if (neu.length < 8) {
        showFormMsg('pwMsg', 'Новый пароль — минимум 8 символов', 'error'); return;
      }
      if (neu !== rep) {
        showFormMsg('pwMsg', 'Новые пароли не совпадают', 'error'); return;
      }
      const btn = document.getElementById('pwChange');
      const oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Меняем…';
      try {
        const res = await fetch('/api/v1/auth/change-password', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: cur, newPassword: neu }),
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('pwCurrent').value = '';
          document.getElementById('pwNew').value = '';
          document.getElementById('pwNew2').value = '';
          const n = (data && typeof data.sessionsClosed === 'number') ? data.sessionsClosed : 0;
          showFormMsg('pwMsg', 'Пароль изменён. Другие устройства отключены (закрыто сессий: ' + n + ')', 'success');
        } else if (res.status === 403) {
          showFormMsg('pwMsg', (data && data.message) || 'Текущий пароль неверен', 'error');
        } else {
          showFormMsg('pwMsg', (data && data.message) || 'Ошибка смены пароля', 'error');
        }
      } catch {
        showFormMsg('pwMsg', 'Ошибка сети. Попробуйте ещё раз.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = oldText;
      }
    });

    function togglePw(id, el) {
      const inp = document.getElementById(id);
      if (inp.type === 'password') { inp.type = 'text'; el.style.opacity = '1'; }
      else { inp.type = 'password'; el.style.opacity = '0.5'; }
    }

    function showFormMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg ' + type;
      el.style.display = 'block';
    }
    function hideFormMsg(id) {
      document.getElementById(id).style.display = 'none';
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function fmt(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
    }

    load();
  </script>
</body>
</html>
